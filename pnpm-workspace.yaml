packages:
  - apps/*
  - packages/*

# Medusa's admin bundler resolves many transitive deps from the project root,
# so a flat (npm-style) node_modules layout is the most reliable choice.
nodeLinker: hoisted

# pnpm blocks dependency install scripts unless allowed explicitly.
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true
  "@parcel/watcher": true
  msgpackr-extract: true
  unrs-resolver: true
  protobufjs: true
  "@medusajs/telemetry": false
